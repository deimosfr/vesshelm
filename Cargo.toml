[package]
name = "vesshelm"
version = "1.5.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.3", features = ["full"] }
which = "8.0.6"

thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10"
indicatif = "0.18.6"
tempfile = "3.27.0"
validator = { version = "0.20.0", features = ["derive"] }
git2 = { version = "0.21.0", features = ["vendored-libgit2", "vendored-openssl"] }
walkdir = "2.5.0"
console = "0.16.6"
daggy = "0.9.0"
petgraph = "0.8.3"
ptree = "0.5.2"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
semver = "1.0.28"
regex = "1.13.1"
clap_complete = "4.6.11"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls-vendored", "json", "blocking", "http2", "charset"] }
async-trait = "0.1.92"
minijinja = { version = "3.0.0", features = ["serde"] }
nix = { version = "0.31.3", features = ["signal"] }
ratatui = "0.30.2"
crossterm = "0.29.0"

[dev-dependencies]
assert_cmd = "2.2.2"
mockall = "0.15.0"
predicates = "3.1.4"
anyhow = "1.0.104"

[profile.release]
strip = true
opt-level = "z"
codegen-units = 1
